<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Salary Predictor</title>
    <link
      href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;600;700&display=swap"
      rel="stylesheet"
    />

    <style>
      :root {
        --primary: #6366f1;
        --accent: #38bdf8;
        --white: #f8fafc;
      }

      body {
        margin: 0;
        font-family: "Outfit", sans-serif;
        background: radial-gradient(circle at top left, #1e3a8a, #0f172a 70%);
        color: var(--white);
        min-height: 100vh;
      }

      header {
        display: flex;
        justify-content: space-between;
        padding: 20px 30px;
        background: rgba(255, 255, 255, 0.05);
        backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(255, 255, 255, 0.08);
      }

      .menu-btn {
        width: 32px;
        height: 22px;
        position: relative;
        cursor: pointer;
      }
      .menu-btn span {
        position: absolute;
        width: 100%;
        height: 3px;
        background: white;
        transition: 0.3s ease;
      }
      .menu-btn span:nth-child(1) {
        top: 0;
      }
      .menu-btn span:nth-child(2) {
        top: 9px;
      }
      .menu-btn span:nth-child(3) {
        bottom: 0;
      }

      .sidebar {
        position: fixed;
        left: -250px;
        top: 0;
        height: 100%;
        width: 250px;
        background: rgba(255, 255, 255, 0.08);
        backdrop-filter: blur(20px);
        transition: 0.4s ease;
        padding-top: 80px;
      }
      .sidebar.active {
        left: 0;
      }
      .sidebar a {
        display: block;
        padding: 16px 30px;
        color: white;
        text-decoration: none;
        transition: 0.3s;
        border-left: 3px solid transparent;
      }
      .sidebar a.active,
      .sidebar a:hover {
        background: rgba(255, 255, 255, 0.1);
        border-left-color: var(--accent);
      }

      .content {
        padding: 40px;
      }

      .panel {
        max-width: 480px;
        margin: auto;
        background: rgba(255, 255, 255, 0.08);
        border-radius: 18px;
        backdrop-filter: blur(16px);
        padding: 35px;
      }

      header h1,
      .panel h2,
      h2 {
        background: linear-gradient(90deg, var(--accent), var(--primary));
        background-clip: text;
        -webkit-background-clip: text;
        color: transparent;
        -webkit-text-fill-color: transparent;
      }

      form {
        display: grid;
        gap: 18px;
      }
      .form-group {
        display: flex;
        flex-direction: column;
      }
      label {
        color: #cbd5e1;
      }

      input,
      select {
        padding: 12px;
        border-radius: 10px;
        border: 1px solid rgba(255, 255, 255, 0.15);
        background: rgba(255, 255, 255, 0.15);
        color: white;
      }

      /* FIX DROPDOWN VISIBILITY */
      select option {
        background: #1e293b !important;
        color: #f8fafc !important;
      }
      select option:hover,
      select option:checked {
        background: #3b82f6 !important;
        color: white !important;
      }

      button {
        background: linear-gradient(90deg, var(--primary), var(--accent));
        border-radius: 10px;
        padding: 14px;
        font-weight: 600;
        cursor: pointer;
        color: white;
        border: none;
      }

      #result {
        margin-top: 14px;
        text-align: center;
        font-size: 18px;
      }

      /* ✅ SHOW GRAPHS IN 2 PER ROW */
      .plots {
        display: grid;
        gap: 24px;
        margin-top: 30px;
        max-width: 900px;
        margin-left: auto;
        margin-right: auto;
      }
      @media (min-width: 500px) {
        .plots {
          grid-template-columns: repeat(2, 1fr);
        }
      }
      @media (max-width: 499px) {
        .plots {
          grid-template-columns: 1fr;
        }
      }

      /* ✅ INCREASE GRAPH SIZE */
      .plot-card {
        padding: 14px;
        background: rgba(255, 255, 255, 0.07);
        border-radius: 14px;
      }
      .plot-card img {
        width: 100%;
        height: 320px;
        object-fit: contain;
      }
    </style>
  </head>

  <body>
    <header>
      <div class="menu-btn" id="menu-btn">
        <span></span><span></span><span></span>
      </div>
      <h1>Salary Predictor</h1>
    </header>

    <div class="sidebar" id="sidebar">
      <a href="#" id="dashboard-link" class="active">🏠 Dashboard</a>
      <a href="#" id="analytics-link">📊 Analytics</a>
    </div>

    <div class="content">
      <section id="dashboard">
        <div class="panel">
          <h2>Predict Salary</h2>
          <h3>Enter details to get Salary estimate</h3>

          <form id="salary-form">
            <div class="form-group">
              <label>Age</label>
              <input name="Age" type="number" required min="18" />
            </div>

            <div class="form-group">
              <label>Gender</label>
              <select name="Gender" required>
                <option value="" disabled selected>Select gender</option>
                <option>Male</option>
                <option>Female</option>
              </select>
            </div>

            <div class="form-group">
              <label>Education Level</label>
              <select name="Education_Level" required>
                <option value="" disabled selected>Select education</option>
                <option>Bachelor's</option>
                <option>Master's</option>
                <option>PhD</option>
              </select>
            </div>

            <div class="form-group">
              <label>Job Title</label>
              <select name="Job_Title" required>
                <option value="" disabled selected>Select job</option>

                <option>Customer Service Rep</option>
                <option>Data Analyst</option>
                <option>Director</option>
                <option>Director of Engineering</option>
                <option>Director of HR</option>
                <option>Financial Analyst</option>
                <option>HR Manager</option>
                <option>Junior Business Operations Analyst</option>
                <option>Junior Financial Advisor</option>
                <option>Junior Operations Coordinator</option>
                <option>Junior Operations Manager</option>
                <option>Junior Research Scientist</option>
                <option>Junior Social Media Specialist</option>
                <option>Marketing Analyst</option>
                <option>Marketing Coordinator</option>
                <option>Operations Manager</option>
                <option>Product Manager</option>
                <option>Project Manager</option>
                <option>Sales Associate</option>
                <option>Sales Manager</option>
                <option>Senior Data Engineer</option>
                <option>Senior Financial Advisor</option>
                <option>Senior Financial Manager</option>
                <option>Senior HR Specialist</option>
                <option>Senior IT Consultant</option>
                <option>Senior Manager</option>
                <option>Senior Operations Coordinator</option>
                <option>Senior Product Development Manager</option>
                <option>Senior Scientist</option>
                <option>Senior Software Architect</option>
                <option>Software Developer</option>
                <option>Software Engineer</option>
              </select>
            </div>
            <div class="form-group">
              <label>Years of Experience</label>
              <input
                name="Years_of_Experience"
                type="number"
                required
                min="0"
              />
            </div>

            <button type="submit">Predict Salary →</button>
          </form>

          <div id="result"></div>
        </div>
      </section>

      <section id="analytics" style="display: none">
        <h2 style="text-align: center">Model Insights</h2>

        <div class="plots">
          <div class="plot-card">
            <img
              src="data:image/png;base64,{{ plots['salary_distribution'] }}"
            />
          </div>
          <div class="plot-card">
            <img
              src="data:image/png;base64,{{ plots['correlation_heatmap'] }}"
            />
          </div>
          <div class="plot-card">
            <img src="data:image/png;base64,{{ plots['salary_vs_age'] }}" />
          </div>
          <div class="plot-card">
            <img
              src="data:image/png;base64,{{ plots['salary_vs_experience'] }}"
            />
          </div>
          <div class="plot-card">
            <img
              src="data:image/png;base64,{{ plots['actual_vs_predicted'] }}"
            />
          </div>
          <div class="plot-card">
            <img
              src="data:image/png;base64,{{ plots['residuals_distribution'] }}"
            />
          </div>
          <div class="plot-card">
            <img
              src="data:image/png;base64,{{ plots['salary_by_education'] }}"
            />
          </div>
          <div class="plot-card">
            <img src="data:image/png;base64,{{ plots['avg_salary_by_job'] }}" />
          </div>
        </div>
      </section>
    </div>

    <script>
      const menuBtn = document.getElementById("menu-btn");
      const sidebar = document.getElementById("sidebar");
      const dashboard = document.getElementById("dashboard");
      const analytics = document.getElementById("analytics");
      const dashboardLink = document.getElementById("dashboard-link");
      const analyticsLink = document.getElementById("analytics-link");
      const resultDiv = document.getElementById("result");

      // Toggle Sidebar
      menuBtn.onclick = () => {
        sidebar.classList.toggle("active");
        menuBtn.classList.toggle("active");
      };

      // Helper to close sidebar & hamburger always
      function closeSidebar() {
        sidebar.classList.remove("active");
        menuBtn.classList.remove("active");
      }

      // Navigation to Dashboard
      dashboardLink.onclick = (e) => {
        e.preventDefault();
        dashboard.style.display = "block";
        analytics.style.display = "none";
        dashboardLink.classList.add("active");
        analyticsLink.classList.remove("active");
        closeSidebar();
      };

      // Navigation to Analytics
      analyticsLink.onclick = (e) => {
        e.preventDefault();
        dashboard.style.display = "none";
        analytics.style.display = "block";
        analyticsLink.classList.add("active");
        dashboardLink.classList.remove("active");
        closeSidebar();
      };

      // Prediction Handler
      document.getElementById("salary-form").onsubmit = async (e) => {
        e.preventDefault();
        const formData = Object.fromEntries(new FormData(e.target).entries());
        formData.Age = Number(formData.Age);
        formData.Years_of_Experience = Number(formData.Years_of_Experience);

        const minAge = { "Bachelor's": 21, "Master's": 23, PhD: 26 };

        if (formData.Age < minAge[formData.Education_Level]) {
          return show(
            `⚠️ Minimum age for ${formData.Education_Level} is ${
              minAge[formData.Education_Level]
            }.`
          );
        }

        if (
          formData.Years_of_Experience >
          formData.Age - minAge[formData.Education_Level]
        ) {
          return show("⚠️ Experience exceeds realistic range.");
        }

        show("⏳ Predicting...");

        try {
          const res = await fetch("/predict", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify(formData),
          });
          const data = await res.json();
          show(
            `💰 Predicted Salary: $${data.predicted_salary.toLocaleString()}`
          );
        } catch {
          show("❌ Server not reachable.");
        }
      };

      function show(msg) {
        resultDiv.textContent = msg;
      }
    </script>
  </body>
</html>
